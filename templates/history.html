<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Event History - Security System</title>

  <!-- 共用樣式 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='global.css') }}">
  <!-- 此頁專用 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='history.css') }}">

</head>

<body>
  <!-- ===== Header 導覽列 ===== -->
  <header>
    <div class="nav-left">
      <h1>Security System</h1>
    </div>
    <div class="nav-right">
      <a href="{{ url_for('index') }}" class="nav-link">Camera Overview</a>
      <a href="{{ url_for('history') }}" class="nav-link active">History</a>
      <a href="{{ url_for('analytics') }}" class="nav-link">Analytics</a>
    </div>
  </header>

  <!-- ===== 主內容 ===== -->
  <main class="fade-in">
    <h2 style="margin-bottom: 20px;">Event History</h2>

    <!-- Filter Bar -->
    <section class="filter-bar card">
      <div class="filter-group">
        <label>Start Date:</label>
        <input type="date" id="startDate" lang="en">
      </div>
      <div class="filter-group">
        <label>End Date:</label>
        <input type="date" id="endDate" lang="en">
      </div>
      <div class="filter-group">
        <label>Type:</label>
        <select id="typeSelect">
          <option value="">All</option>
          <option value="inout">One-way</option>
          <option value="intrusion">Intrusion</option>
          <option value="climbing">Climbing</option>
          <option value="falling">Falling</option>
        </select>

      </div>
      <div class="filter-group">
        <label>Level:</label>
        <select id="levelSelect">
          <option value="">All</option>
          <option value="heavy">Heavy</option>
          <option value="medium">Medium</option>
          <option value="light">Light</option>
        </select>
      </div>
      <button id="filterBtn" class="btn">Filter</button>
    </section>

    <!-- Table -->
    <section class="fade-in">
      <table id="eventTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Camera</th>
            <th>Gate</th>
            <th>Event Type</th>
            <th>Alert Level</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="table-controls">
        <select id="rowsPerPage">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="30" selected>30</option>
          <option value="50">50</option>
        </select>

        <div class="pagination">
          <button id="prevPage" class="btn small">Prev</button>
          <span id="pageInfo"></span>
          <button id="nextPage" class="btn small">Next</button>
        </div>
      </div>
    </section>
  </main>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="{{ url_for('static', filename='history.js') }}"></script>
  <script>
    flatpickr("#startDate", {
      dateFormat: "Y-m-d"
    });

    flatpickr("#endDate", {
      dateFormat: "Y-m-d"
    });
  </script>
</body>

</html>
