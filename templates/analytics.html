<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Analytics - Security System</title>

  <!-- 全域樣式 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='global.css') }}">
  <!-- 本頁樣式 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='analytics.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <!-- ===== Header ===== -->
  <header>
    <div class="nav-left">
      <h1>Security System</h1>
    </div>
    <div class="nav-right">
      <a href="{{ url_for('index') }}" class="nav-link">Camera Overview</a>
      <a href="{{ url_for('history') }}" class="nav-link">History</a>
      <a href="{{ url_for('analytics') }}" class="nav-link active">Analytics</a>
    </div>
  </header>

  <!-- ===== Main Content ===== -->
  <main class="analytics-container fade-in">
    <!-- ===== Main Content ===== -->
    <div  class="analytics-container fade-in">

      <!-- ==== Tabs ==== -->
      <div class="ana-tabs">
        <div id="tab-flow" class="ana-tab active">People Flow</div>
        <div id="tab-safety" class="ana-tab">AI Safety</div>
      </div>

      <!-- ========== People Flow Section ========== -->
      <section id="flow-section">
        <h2 style="margin-bottom: 20px;">People Flow Analytics</h2>

        <!-- Camera Selector -->
        <section class="camera-selector card">
          <label for="cameraSelect">Select Camera:</label>
          <select id="cameraSelect">
            <option value="">All Cameras</option>
          </select>
        </section>

        <!-- Chart: Last 24 Hours -->
        <section class="chart-section card fade-in">
          <div class="chart-header">
            <h3>Last 24 Hours (Hourly)</h3>
          </div>
          <canvas id="hourlyChart"></canvas>
        </section>

        <!-- Chart: Last 7 Days -->
        <section class="chart-section card fade-in">
          <div class="chart-header">
            <h3>Last 7 Days (Daily)</h3>
          </div>
          <canvas id="weeklyChart"></canvas>
        </section>

        <!-- Chart: Custom Range -->
        <section class="chart-section card fade-in">
          <div class="chart-header">
            <h3>Custom Time Range</h3>
            <div class="time-filter">
              <label>Start:</label>
              <input type="text" id="startTime" value="09:00">
              <label>End:</label>
              <input type="text" id="endTime" value="18:00">
              <button id="filterBtn" class="btn">Apply</button>
            </div>
          </div>
          <canvas id="customChart"></canvas>
        </section>
      </section>

      <!-- ========== AI Safety Section (Hidden by default) ========== -->
      <section id="safety-section" class="hidden">

        <h2 style="margin-bottom: 20px;">AI Safety Analysis</h2>

        <section class="card camera-selector">
          <label>Select Camera:</label>
          <select id="safetyCameraSelect">
            <option value="">All Cameras</option>
          </select>
        </section>

        <!-- Records List -->
        <div id="safetyList" class="safety-list"></div>

      </section>

    </div >

    <!-- ===== People Flow Panel (原本的全部包進這裡) ===== -->
    <!-- ===== Safety Slide Panel ===== -->
    





  </main>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="{{ url_for('static', filename='analytics.js') }}"></script>

  <script>
    flatpickr("#startTime", {
      enableTime: true,
      noCalendar: true,
      dateFormat: "H:i",
      time_24hr: true
    });

    flatpickr("#endTime", {
      enableTime: true,
      noCalendar: true,
      dateFormat: "H:i",
      time_24hr: true
    });
  </script>
</body>

</html>
