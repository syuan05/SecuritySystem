<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Camera View - Security System</title>

  <!-- 全站樣式 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='global.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='camera.css') }}">
</head>

<body>
  <header>
    <div class="nav-left">
      <h1>Security System</h1>
    </div>
    <div class="nav-right">
      <a href="{{ url_for('index') }}" class="nav-link">Camera Overview</a>
      <a href="{{ url_for('history') }}" class="nav-link">History</a>
      <a href="{{ url_for('analytics') }}" class="nav-link">Analytics</a>
    </div>
  </header>

  <h2 id="cameraTitle" style="margin: 20px 30px 0; color:#1e293b;"></h2>

  <main class="camera-layout fade-in">

    <!-- ========== 左側分頁設定區 ========== -->
    <section class="left-panel">

      <!-- Tabs -->
      <div class="flat-tabs">
        <span id="tab-info" class="flat-tab active" onclick="switchTab('info')">
          Camera Info
        </span>
        <span id="tab-functions" class="flat-tab" onclick="switchTab('functions')">
          Function Settings
        </span>
      </div>
      <!-- Panel 1: Camera Info + Safety Analysis (合併 save) -->
      <div id="panel-info" class="tab-panel">

        <!-- Camera Name -->
        <div class="setting-card">
          <label>Camera Name</label>
          <input id="cam-name">
        </div>

        <!-- Location -->
        <div class="setting-card">
          <label>Location</label>
          <input id="cam-location">
        </div>

        <!-- Safety Analysis Block -->
        <div class="setting-card">
          <div class="setting-row">
            <span class="setting-label">Safety Analysis</span>
            <label class="switch">
              <input id="safety-switch" type="checkbox">
              <span class="slider"></span>
            </label>
          </div>

          <!-- Interval -->
          <div class="sub-row">
            <label>Interval</label>
            <select id="safety-interval" disabled>
              <option value="10">10 min</option>
              <option value="30">30 min</option>
              <option value="60">1 hr</option>
              <option value="180">3 hr</option>
              <option value="720">12 hr</option>
              <option value="1440">24 hr</option>
            </select>
          </div>

          <!-- Location Type -->
          <div class="sub-row">
            <label>Location Type</label>
            <select id="safety-location">
              <option value="">-- Select --</option>

              <option value="車站大廳">Station Lobby</option>
              <option value="商場通道">Mall Corridor</option>
              <option value="住宅走廊">Residential Corridor</option>
              <option value="停車場">Parking Lot</option>
              <option value="校園">Campus</option>
              <option value="醫院">Hospital</option>
              <option value="大樓大廳">Building Lobby</option>
              <option value="樓梯間">Stairwell</option>
              <option value="工地">Construction Site</option>
              <option value="倉庫">Warehouse</option>
              <option value="工廠">Factory</option>
              <option value="公園">Park</option>
              <option value="超市">Supermarket</option>
              <option value="電梯前室">Elevator Lobby</option>
              <option value="旅館">Hotel</option>
              <!-- <option value="電扶梯">Escalator</option> -->
              <option value="其他">Other</option>

            </select>
          </div>

          <!-- Custom Location -->
          <div class="sub-row hidden" id="location-custom-row">
            <label>Custom</label>
            <input id="safety-location-custom" disabled placeholder="Describe location...">
          </div>
        </div>

        <!-- Unified Save Button -->
        <button class="btn-outline" onclick="saveAllSettings()">Save</button>

      </div>

      <!-- ========== Function Settings Tab ========== -->
      <div id="panel-functions" class="tab-panel hidden">
        <!-- One-way -->
        <div class="setting-card">
          <div class="setting-row">
            <span class="setting-label">One-Way Violation</span>
            <a data-type="inout" class="btn-sm fence-btn">✎ Edit</a>
          </div>
          <div id="inout_panel" class="fence-panel hidden"></div>
        </div>

        <!-- Distance -->
        <div class="setting-card">
          <div class="setting-row">
            <span class="setting-label">Distance-Based Alert</span>
            <a data-type="intrusion" class="btn-sm fence-btn">✎ Edit</a>
          </div>
          <div id="intrusion_panel" class="fence-panel hidden"></div>
        </div>

        <!-- People Counting -->
        <div class="setting-card">
          <div class="setting-row">
            <span class="setting-label">People Counting</span>
            <a data-type="crowd" class="btn-sm fence-btn">✎ Edit</a>
          </div>
          <div id="crowd_panel" class="fence-panel hidden"></div>
        </div>
        <!-- Climbing -->
        <div class="setting-card">
          <div class="setting-row">
            <span class="setting-label">Climbing</span>
            <label class="switch">
              <input id="climb-switch" type="checkbox">
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-btn">
            <div id="climb-time" class="time-link">[--:-- ~ --:--]</div>
          </div>
        </div>

        <!-- Falling -->
        <div class="setting-card">
          <div class="setting-row">
            <span class="setting-label">Falling</span>
            <label class="switch">
              <input id="fall-switch" type="checkbox">
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-btn">
            <div id="fall-time" class="time-link">[--:-- ~ --:--]</div>
          </div>
        </div>
      </div>
    </section>

    <!-- ========== 右側影像區 ========== -->
    <section class="video-panel">
      <div class="video-container fade-in">
        <img id="videoStream" src="" class="video-stream">
        <canvas id="drawCanvas"></canvas>
      </div>
      <!-- 🟢🟡 圖例在這裡 -->
      <div class="video-legend">
        <span class="legend-item">
          <span class="dot dot-green"></span> One-Way
        </span>

        <span class="divider">|</span>

        <span class="legend-item">
          <span class="dot dot-yellow"></span> Counting
        </span>
      </div>
    </section>

  </main>

  <!-- JS -->
  <script type="module" src="{{ url_for('static', filename='camera.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">


</body>

</html>
