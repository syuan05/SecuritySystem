<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Camera View - Security System</title>

  <!-- 共用全站樣式 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='global.css') }}">
  <!-- 此頁專用樣式 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='camera.css') }}">
</head>

<body>
  <!-- ===== Header ===== -->
  <header>
    <div class="nav-left">
      <h1>Security System</h1>
    </div>
    <div class="nav-right">
      <a href="{{ url_for('index') }}" class="nav-link">Camera Overview</a>
      <a href="{{ url_for('history') }}" class="nav-link">History</a>
      <a href="{{ url_for('analytics') }}" class="nav-link">Analytics</a>
    </div>
  </header>
  <h2 id="cameraTitle" style="margin: 20px 30px 0; color: #1e293b;"></h2>
  <!-- ===== 主體布局 ===== -->
  <main class="camera-layout fade-in">

    <!-- ===== 左側設定面板 ===== -->
    <section class="left-panel">
      <h2>Camera Settings</h2>

      <!-- Climbing -->
      <div class="setting-card">
        <div class="setting-row">
          <span class="setting-label">Climbing</span>
          <label class="switch">
            <input id="climb-switch" type="checkbox">
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-btn">
          <div id="climb-time" class="time-link">[--:-- ~ --:--]</div>
        </div>
      </div>

      <!-- Falling -->
      <div class="setting-card">
        <div class="setting-row">
          <span class="setting-label">Falling</span>
          <label class="switch">
            <input id="fall-switch" type="checkbox">
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-btn">
          <div id="fall-time" class="time-link">[--:-- ~ --:--]</div>
        </div>
      </div>

      <!-- One-Way Violation -->
      <div class="setting-card">
        <div class="setting-row">
          <span class="setting-label">One-Way Violation</span>
          <a data-type="inout" class="btn-sm fence-btn">+ Edit Fence</a>
        </div>
        <div id="inout_panel" class="fence-panel hidden"></div>
      </div>

      <!-- Distance-Based Alert -->
      <div class="setting-card">
        <div class="setting-row">
          <span class="setting-label">Distance-Based Alert</span>
          <a data-type="intrusion" class="btn-sm fence-btn">+ Edit Fence</a>
        </div>
        <div id="intrusion_panel" class="fence-panel hidden"></div>
      </div>

      <!-- People Counting -->
      <div class="setting-card">
        <div class="setting-row">
          <span class="setting-label">People Counting</span>
          <a data-type="crowd" class="btn-sm fence-btn">+ Edit Fence</a>
        </div>
        <div id="crowd_panel" class="fence-panel hidden"></div>
      </div>

    </section>

    <!-- ===== 右側影片區 ===== -->
    <section class="video-panel">
      <div class="video-container fade-in">
        <img id="videoStream" src="" alt="Camera Stream" class="video-stream">
        <canvas id="drawCanvas"></canvas>
      </div>
    </section>
  </main>

  <script type="module" src="{{ url_for('static', filename='camera.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</body>
</html>
